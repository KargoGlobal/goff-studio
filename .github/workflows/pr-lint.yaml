name: Lint PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  title:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
