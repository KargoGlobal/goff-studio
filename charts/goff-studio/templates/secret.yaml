{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "goff-studio.fullname" . }}
  labels:
    {{- include "goff-studio.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if lt (len .Values.secrets.sessionSecret) 16 }}
  {{- fail "secrets.sessionSecret must be at least 16 characters (server.sessionSecret is validated at startup)" }}
  {{- end }}
  {{ .Values.secrets.sessionSecretKey }}: {{ .Values.secrets.sessionSecret | quote }}
  {{- if .Values.secrets.githubAppPrivateKey }}
  {{ .Values.secrets.privateKeyKey }}: |
    {{- .Values.secrets.githubAppPrivateKey | nindent 4 }}
  {{- end }}
  {{- if .Values.secrets.oidcClientSecret }}
  {{ .Values.secrets.oidcClientSecretKey }}: {{ .Values.secrets.oidcClientSecret | quote }}
  {{- end }}
{{- end }}
