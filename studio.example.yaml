# Copy to studio.yaml. Any key can be overridden with a GOFF_STUDIO_* env var; see README.md.
server:
  addr: ":8080"
  # Public URL for Studio; the OIDC redirect is <baseURL>/auth/callback and must match your provider exactly.
  baseURL: https://studio.internal.example.com
  # Min 16 chars, via GOFF_STUDIO_SESSION_SECRET in production; generate with: openssl rand -hex 32
  sessionSecret: generate-with-openssl-rand-hex-32
  # Set true whenever Studio is served over HTTPS.
  secureCookies: true

oidc:
  # Studio runs OIDC discovery against this at startup and fails fast if unreachable.
  issuerURL: https://your-org.okta.com/oauth2/default
  clientID: 0oa1example
  # Supply via GOFF_STUDIO_OIDC_CLIENT_SECRET rather than committing it.
  clientSecret: from-your-provider
  # ID token claim holding group names, matched against permissions[].group below.
  groupsClaim: groups

# Where flags are stored. kind uses GO Feature Flag's retriever names. github is
# the default and the only kind that offers history, attribution and review.
# Override with GOFF_STUDIO_STORAGE.
storage:
  kind: github

# For local development with no credentials at all:
# storage:
#   kind: file
#   path: ./flags
#
# S3; see backends/s3/README.md.
# No attribution and no review, so Studio's permissions are the only control.
# storage:
#   kind: s3
#   bucket: my-flags-bucket
#   region: us-east-1
#
# Google Cloud Storage; see backends/gcs/README.md.
# storage:
#   kind: googleStorage
#   bucket: my-flags-bucket
#
# Azure Blob Storage; see backends/azblob/README.md.
# storage:
#   kind: azureBlobStorage
#   bucket: flags          # the container
#   options:
#     accountURL: https://myaccount.blob.core.windows.net
#
# Kubernetes ConfigMaps; see backends/configmap/README.md. No history, attribution or review.
# storage:
#   kind: configmap
#   prefix: goff-          # production -> ConfigMap goff-production
#   options:
#     namespace: flags     # defaults to Studio's own namespace

github:
  owner: your-org
  # Studio only ever reads and writes this one repository.
  repo: flags-repo
  # MUST be branch-protected so only Studio's App can push, or permissions below are bypassable.
  branch: main
  # Quoted because these are strings, not numbers.
  appID: "123456"
  installationID: "7890123"
  # RSA PEM from the GitHub App (PKCS#1 or PKCS#8), mode 0600.
  privateKeyPath: /etc/goff-studio/github-app.pem
  # Set github.devToken instead of the three keys above for local dev only.

# Only feeds the "live in apps within about N seconds" message; match your apps' polling interval.
expectedPollSeconds: 30

# Environments are found from storage folders; these ones force a diff plus typed confirmation before saving.
protectedEnvironments: [production]

# The only teams Studio offers; flags can also have no team. Omit this to run without teams.
# Editors get full access to their team's flags in every environment.
teams:
  - name: payments
    editors: [payments-team]
  - name: growth
    editors: [growth-engineers]

# Default deny: no matching rule means no access. "*" covers every team and flags with no team.
permissions:
  # Full access everywhere.
  - group: flags-admins
    teams: ["*"]

  # Business users who may flip and ramp growth flags in production, but not change targeting.
  - group: marketing
    teams: [growth]
    environments: [production]
    actions: [toggle, rollout]
